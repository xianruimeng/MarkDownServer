<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Markdown Editor</title>

  <!-- CodeMirror 5 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.css">

  <!-- highlight.js -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/styles/github.min.css">

  <!-- App styles -->
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h2>Files</h2>
        <button id="new-file-btn" title="New file">+</button>
      </div>
      <ul id="file-list"></ul>
    </aside>
    <main class="editor-area">
      <div class="toolbar">
        <span id="current-file-name">No file selected</span>
        <div class="toolbar-actions">
          <div id="active-users" class="active-users" title="Active users"></div>
          <button id="save-btn" disabled>Save</button>
          <button id="delete-btn" disabled>Delete</button>
          <button id="toggle-comments-btn" disabled>Comments</button>
        </div>
      </div>
      <div class="panes">
        <div class="pane editor-pane">
          <textarea id="editor"></textarea>
        </div>
        <div class="pane preview-pane">
          <div id="preview" class="markdown-body"></div>
        </div>
      </div>
    </main>
    <aside class="comments-panel" id="comments-panel">
      <div class="comments-header">
        <h3>Comments</h3>
        <button id="close-comments-btn">&times;</button>
      </div>
      <div class="comments-list" id="comments-list"></div>
      <div class="comment-form">
        <textarea id="comment-input" placeholder="Add a comment..."></textarea>
        <button id="add-comment-btn">Post Comment</button>
      </div>
    </aside>
  </div>

  <!-- CodeMirror 5 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.18/mode/markdown/markdown.min.js"></script>

  <!-- Marked -->
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <!-- highlight.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.11.1/highlight.min.js"></script>

  <!-- Socket.io -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- App -->
  <script src="/js/app.js"></script>
</body>
</html>
